name: Eval result
description: Share results from running the behaviour evals or trigger queries in evals/.
title: "[Eval] "
body:
  - type: markdown
    attributes:
      value: |
        Results with and without the skill are the most useful, including failures. Remove secrets and personal data from transcripts and outputs.
  - type: input
    id: evals
    attributes:
      label: What did you run?
      description: Eval ids from evals/evals.json, or the trigger queries.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Agent and version, model, how you installed the skill, and the Whetstone version or commit.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: Runs per eval or query, the baseline you compared against, and how you graded the assertions.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Pass or fail per assertion, or trigger rates per query, with and without the skill. A table is fine.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything surprising
      description: Assertions that were too easy or too hard, flaky runs, and the time and token cost.
